<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLF Knowledge Base</title>
<meta name="description" content="Browsable view of the myViewBoard OLF knowledge base (docs, helpers and examples).">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" id="hljs-light">
<style>
:root{
  --bg:#ffffff; --panel:#f6f8fa; --text:#1f2328; --muted:#59636e; --border:#d1d9e0;
  --accent:#0969da; --code:#eff1f3; --hl:#fff8c5; --side:300px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0d1117; --panel:#151b23; --text:#e6edf3; --muted:#9198a1; --border:#3d444d; --accent:#4493f8; --code:#1c232c; --hl:#3b2e00; }
}
:root[data-theme="dark"]{ --bg:#0d1117; --panel:#151b23; --text:#e6edf3; --muted:#9198a1; --border:#3d444d; --accent:#4493f8; --code:#1c232c; --hl:#3b2e00; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
header{position:fixed;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border);z-index:20}
header h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap}
header .sp{flex:1}
button,.btn{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;text-decoration:none;display:inline-block;line-height:1.4}
button:hover,.btn:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
#menu{display:none}
nav{position:fixed;top:52px;bottom:0;left:0;width:var(--side);overflow:auto;background:var(--panel);border-right:1px solid var(--border);padding:12px 10px 40px;z-index:10}
nav input{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;font-size:14px;margin-bottom:10px}
nav h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 6px 4px}
nav a{display:block;padding:3px 8px;border-radius:5px;color:var(--text);text-decoration:none;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav a:hover{background:var(--code)}
nav a.on{background:var(--accent);color:#fff}
nav a .ext{color:var(--muted);font-size:11px;margin-left:6px}
nav a.on .ext{color:#dbeafe}
#src{font-size:12px;color:var(--muted);margin:2px 6px 10px}
main{margin-left:var(--side);padding:76px 32px 80px}
article{max-width:880px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.bar .path{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);word-break:break-all}
.bar .acts{display:flex;gap:6px}
.md h1,.md h2{border-bottom:1px solid var(--border);padding-bottom:.3em}
.md h1,.md h2,.md h3,.md h4{margin:1.5em 0 .6em;line-height:1.25}
.md h1{margin-top:0}
.md img{max-width:100%}
.md pre{background:var(--code);padding:14px;border-radius:8px;overflow:auto;font-size:13px;line-height:1.45}
.md code{font:.88em ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--code);padding:.15em .35em;border-radius:4px}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;display:block;overflow:auto;margin:1em 0}
.md th,.md td{border:1px solid var(--border);padding:6px 12px}
.md th{background:var(--panel)}
.md blockquote{margin:1em 0;padding:0 1em;color:var(--muted);border-left:4px solid var(--border)}
.md hr{border:0;border-top:1px solid var(--border);margin:2em 0}
.fm{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:18px}
.fm b{color:var(--text)}
.code pre{background:var(--code);padding:14px;border-radius:8px;overflow:auto;font-size:13px;line-height:1.45;margin:0}
.msg{padding:12px 14px;border-radius:8px;background:var(--hl);border:1px solid var(--border);margin:12px 0;font-size:14px}
@media (max-width:820px){
  #menu{display:inline-block}
  nav{transform:translateX(-102%);transition:transform .2s;width:min(86vw,320px)}
  body.open nav{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  main{margin-left:0;padding:72px 16px 60px}
  header h1{font-size:14px}
}
</style>
</head>
<body>
<header>
  <button id="menu" aria-label="Toggle file list">☰ Files</button>
  <h1>OLF Knowledge Base</h1>
  <span class="sp"></span>
  <button id="live" aria-pressed="false" title="Switch between the bundled files.json and the live GitHub API listing">Live view: off</button>
  <button id="theme" title="Toggle light / dark">◐</button>
  <a class="btn" id="repo" target="_blank" rel="noopener">GitHub</a>
</header>
<nav id="nav">
  <input id="q" type="search" placeholder="Filter files…" autocomplete="off">
  <div id="src"></div>
  <div id="list"></div>
</nav>
<main><article id="view"><p>Loading…</p></article></main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<script>
/* ---- configuration ---------------------------------------------------------- */
const OWNER = "vs-rod-ord", REPO = "animated-octo-garbanzo", BRANCH = "main";
const DEFAULT_FILE = "README.md";
const SHOW = /\.(md|txt|py|yaml|yml|json)$/i;      // what appears in the sidebar
const HIDE = /^(_built_examples|__pycache__|\.git)/; // never listed
const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
// Where file CONTENT is read from:
//   "raw"      -> always raw.githubusercontent.com (use when this page is NOT in the repo root, e.g. /docs)
//   "relative" -> files next to this page first, raw as a fallback (use if you copy the .md files beside index.html)
const CONTENT_SOURCE = "raw";
const BLOB = `https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/`;

/* ---- state ------------------------------------------------------------------ */
let files = [];          // sorted array of repo-relative paths
let fileSet = new Set();
let live = false;
let current = null;
const $ = id => document.getElementById(id);
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} },
                set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };

$("repo").href = `https://github.com/${OWNER}/${REPO}`;

/* ---- theme ------------------------------------------------------------------ */
function applyTheme(t){
  if(t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("hljs-light").href = "https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/" + (dark ? "github-dark" : "github") + ".min.css";
}
applyTheme(store.get("okf-theme"));
$("theme").onclick = () => {
  const dark = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() === "#0d1117";
  const t = dark ? "light" : "dark"; store.set("okf-theme", t); applyTheme(t);
};

/* ---- file list -------------------------------------------------------------- */
function setFiles(list){
  files = list.filter(p => SHOW.test(p) && !HIDE.test(p)).sort(cmp);
  fileSet = new Set(files);
}
function cmp(a, b){            // root files first (README, llms.txt, CORE...), then folders A-Z
  const ra = !a.includes("/"), rb = !b.includes("/");
  if(ra !== rb) return ra ? -1 : 1;
  const rank = p => ({ "README.md":0, "llms.txt":1, "CORE.md":2 }[p] ?? 9);
  if(ra && rb && rank(a) !== rank(b)) return rank(a) - rank(b);
  return a.localeCompare(b, undefined, {numeric:true});
}
async function loadStatic(){
  const r = await fetch("files.json", {cache:"no-cache"});
  if(!r.ok) throw new Error("files.json: HTTP " + r.status);
  const j = await r.json();
  setFiles(Array.isArray(j) ? j : j.files);
  $("src").textContent = "Source: files.json" + (j.generated ? " (" + j.generated + ")" : "");
}
async function loadLive(){
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`,
                        {headers:{Accept:"application/vnd.github+json"}});
  if(!r.ok) throw new Error(r.status === 403 ? "GitHub API rate limit reached (60/hour without a token)" : "GitHub API: HTTP " + r.status);
  const j = await r.json();
  setFiles(j.tree.filter(t => t.type === "blob").map(t => t.path));
  $("src").textContent = "Source: live GitHub API (" + BRANCH + ")";
}
function renderList(){
  const q = $("q").value.trim().toLowerCase();
  const out = []; let group = null;
  for(const p of files){
    if(q && !p.toLowerCase().includes(q)) continue;
    const g = p.includes("/") ? p.split("/")[0] : "";
    if(g !== group){ group = g; if(g) out.push(`<h2>${esc(g)}</h2>`); }
    const name = p.split("/").pop(), ext = (name.match(/\.[^.]+$/)||[""])[0];
    out.push(`<a href="#/${encodeURI(p)}" data-p="${esc(p)}" class="${p===current?"on":""}">${esc(name.slice(0, name.length-ext.length))}<span class="ext">${esc(ext)}</span></a>`);
  }
  $("list").innerHTML = out.join("") || '<p class="msg">No match.</p>';
}
$("q").oninput = renderList;

/* ---- live toggle ------------------------------------------------------------ */
$("live").onclick = async () => {
  const want = !live, btn = $("live");
  btn.disabled = true;
  try{
    await (want ? loadLive() : loadStatic());
    live = want; store.set("okf-live", live ? "1" : "0");
    btn.setAttribute("aria-pressed", live); btn.textContent = "Live view: " + (live ? "on" : "off");
    renderList();
  }catch(e){
    $("view").insertAdjacentHTML("afterbegin", `<div class="msg">Could not switch: ${esc(e.message)}. Staying on ${live ? "live" : "files.json"}.</div>`);
  }
  btn.disabled = false;
};

/* ---- helpers ---------------------------------------------------------------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function slug(t){ return t.toLowerCase().trim().replace(/[^\w\- ]+/g,"").replace(/ /g,"-"); }
async function fetchText(path){
  // same-origin first (GitHub Pages); fall back to raw.githubusercontent.com (e.g. when opened from disk)
  if(CONTENT_SOURCE === "relative"){
    try{ const r = await fetch(encodeURI(path), {cache:"no-cache"}); if(r.ok) return await r.text(); }catch(e){}
  }
  const r = await fetch(RAW + encodeURI(path));
  if(!r.ok) throw new Error(path + ": HTTP " + r.status);
  return await r.text();
}
function splitFront(text){
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  return m ? {fm:m[1], body:text.slice(m[0].length)} : {fm:null, body:text};
}
function fmHtml(fm){
  const rows = []; let top = null;
  for(const line of fm.split(/\r?\n/)){
    const m = line.match(/^(\w[\w-]*):\s*(.*)$/);
    if(m){ top = m[1]; if(m[2]) rows.push([m[1], m[2]]); }
    else if(line.trim() && top) rows.push(["  " + line.trim().replace(/:.*/,""), line.trim().replace(/^[^:]*:\s*/,"")]);
  }
  const keep = rows.filter(r => /^(name|description|type|status)$/.test(r[0].trim()));
  return keep.length ? `<div class="fm">${keep.map(r=>`<b>${esc(r[0].trim())}</b>: ${esc(r[1])}`).join(" &nbsp;·&nbsp; ")}</div>` : "";
}
function resolve(base, href){      // resolve a relative link against the current file's folder
  const dir = base.includes("/") ? base.slice(0, base.lastIndexOf("/") + 1) : "";
  const u = new URL(href, "http://x/" + dir);
  return decodeURIComponent(u.pathname.slice(1)) + u.hash;
}

/* ---- rendering -------------------------------------------------------------- */
async function show(path){
  current = path;
  document.body.classList.remove("open");
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.p === path));
  const view = $("view");
  const bar = `<div class="bar"><span class="path">${esc(path)}</span><span class="acts">
      <a class="btn" href="${RAW + encodeURI(path)}" target="_blank" rel="noopener">Raw</a>
      <a class="btn" href="${BLOB + encodeURI(path)}" target="_blank" rel="noopener">GitHub</a>
      <button id="copy">Copy raw URL</button></span></div>`;
  view.innerHTML = bar + "<p>Loading…</p>";
  document.title = path.split("/").pop() + " · OLF Knowledge Base";
  $("copy").onclick = e => { navigator.clipboard?.writeText(RAW + path); e.target.textContent = "Copied"; setTimeout(()=>e.target.textContent="Copy raw URL",1200); };
  try{
    const text = await fetchText(path);
    if(current !== path) return;
    let html;
    if(/\.md$/i.test(path)){
      const {fm, body} = splitFront(text);
      html = (fm ? fmHtml(fm) : "") + '<div class="md">' + DOMPurify.sanitize(marked.parse(body, {gfm:true})) + "</div>";
    }else{
      html = `<div class="code"><pre><code>${esc(text)}</code></pre></div>`;
    }
    view.innerHTML = bar + html;
    $("copy").onclick = e => { navigator.clipboard?.writeText(RAW + path); e.target.textContent = "Copied"; setTimeout(()=>e.target.textContent="Copy raw URL",1200); };
    decorate(view, path);
  }catch(e){
    view.innerHTML = bar + `<div class="msg">Could not load this file: ${esc(e.message)}</div>`;
  }
  window.scrollTo(0, 0);
}
function decorate(view, path){
  view.querySelectorAll(".md h1,.md h2,.md h3,.md h4").forEach(h => { h.id = slug(h.textContent); });
  view.querySelectorAll(".md a[href]").forEach(a => {
    const href = a.getAttribute("href");
    if(/^(https?:|mailto:)/i.test(href)){ a.target = "_blank"; a.rel = "noopener"; return; }
    if(href.startsWith("#")){ a.dataset.anchor = href.slice(1); a.removeAttribute("href"); a.style.cursor = "pointer"; return; }
    const r = resolve(path, href), [p, hash] = r.split("#");
    if(p.endsWith("/")){ a.dataset.folder = p; a.removeAttribute("href"); a.style.cursor = "pointer"; return; }  // folder link -> filter sidebar
    if(fileSet.has(p)) a.setAttribute("href", "#/" + encodeURI(p) + (hash ? "#" + hash : ""));
    else { a.setAttribute("href", RAW + encodeURI(p)); a.target = "_blank"; a.rel = "noopener"; }
  });
  view.querySelectorAll("pre code").forEach(c => { try{ hljs.highlightElement(c); }catch(e){} });
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-anchor]");
  if(a){ e.preventDefault(); document.getElementById(a.dataset.anchor)?.scrollIntoView({behavior:"smooth"}); return; }
  const f = e.target.closest("a[data-folder]");
  if(f){ e.preventDefault(); $("q").value = f.dataset.folder; renderList(); document.body.classList.add("open"); }
});

/* ---- routing ---------------------------------------------------------------- */
function route(){
  let h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [p, anchor] = h.split("#");
  const target = p || DEFAULT_FILE;
  if(target === current && anchor){ document.getElementById(anchor)?.scrollIntoView(); return; }
  show(target).then(() => { if(anchor) document.getElementById(anchor)?.scrollIntoView(); });
}
window.addEventListener("hashchange", route);
$("menu").onclick = () => document.body.classList.toggle("open");

/* ---- boot ------------------------------------------------------------------- */
(async () => {
  try{
    if(store.get("okf-live") === "1"){ await loadLive(); live = true; $("live").setAttribute("aria-pressed", true); $("live").textContent = "Live view: on"; }
    else await loadStatic();
  }catch(e){
    try{ await loadStatic(); }catch(e2){ $("view").innerHTML = `<div class="msg">Could not load the file list: ${esc(e2.message)}</div>`; return; }
  }
  renderList();
  route();
})();
</script>
</body>
</html>
